name: ${COMPOSE_PROJECT_NAME:?Run scripts/configure.py}
services:
  kuma:
    image: louislam/uptime-kuma:2.5.6-slim@sha256:5db97dbbef610276e1699f3ece586c3509c8fd35de75d45ff5109761a1b377dc
    restart: unless-stopped
    environment:
      TZ: America/Santiago
      DATA_DIR: /app/data
      UPTIME_KUMA_PORT: "3001"
    volumes:
      - data:/app/data
    expose: ["3001"]
    healthcheck:
      test: [CMD, /app/extra/healthcheck]
      interval: 60s
      timeout: 30s
      start_period: 180s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  data:
    name: ${DATA_VOLUME:?Run scripts/configure.py}
